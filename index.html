<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ec">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Relatório">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Relatório de Campo</title>
<style>
/* Paleta: verde (marca/pioneiro regular), âmbar (auxiliar/crédito), ardósia (publicador/revisita).
   Contraste de texto ≥ 4,5:1 e de controles ≥ 3:1, em claro e escuro. */
:root{
  --bg:#f4f2ec;--card:#ffffff;--field:#f8f7f3;--ink:#18211d;--muted:#56605a;--line:#e2ded4;--off:#8a938d;
  --accent:#2b6a4c;--accent-ink:#ffffff;--accent-soft:#e2efe7;--accent-text:#225a40;
  --amber:#8a5410;--amber-soft:#fbecd6;--slate:#44515f;--slate-soft:#e7ebf0;
  --danger:#a8322e;--shadow:0 1px 2px rgba(20,30,25,.05),0 6px 18px rgba(20,30,25,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1412;--card:#18201c;--field:#121915;--ink:#e7ece9;--muted:#9ba8a1;--line:#2a342f;--off:#647169;
    --accent:#6cc296;--accent-ink:#0b1410;--accent-soft:#1f3329;--accent-text:#8fd6b0;
    --amber:#e9b46b;--amber-soft:#3a2b17;--slate:#b5c0cc;--slate-soft:#27303a;--danger:#ef8a85;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1412;--card:#18201c;--field:#121915;--ink:#e7ece9;--muted:#9ba8a1;--line:#2a342f;--off:#647169;
  --accent:#6cc296;--accent-ink:#0b1410;--accent-soft:#1f3329;--accent-text:#8fd6b0;
  --amber:#e9b46b;--amber-soft:#3a2b17;--slate:#b5c0cc;--slate-soft:#27303a;--danger:#ef8a85;--shadow:none;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.i{width:20px;height:20px;flex:none}
.i.xs{width:16px;height:16px}
.i.lg{width:40px;height:40px}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}
html{overscroll-behavior-y:none}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px}
h1{font-size:20px;margin:0;letter-spacing:-.015em}
.sub{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;margin-top:2px}
.langs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.langs button{min-width:44px;height:38px;border:0;background:transparent;color:var(--muted);border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.langs button.on{background:var(--ink);color:var(--bg)}

.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;flex:none;padding:0}
.icon-btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.mlabel{flex:1;min-height:44px;border:0;background:transparent;font-size:17px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.mlabel small{font-size:12px;font-weight:600;color:var(--accent-text)}

.cat-pub{--c:var(--slate);--cs:var(--slate-soft)}
.cat-aux{--c:var(--amber);--cs:var(--amber-soft)}
.cat-reg{--c:var(--accent);--cs:var(--accent-soft)}
.hero{border-radius:20px;padding:16px;margin-bottom:12px;background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 20%,transparent)}
.hero-top{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--card);color:var(--c,var(--accent-text));font-size:13px;font-weight:700}
.chip .i{width:15px;height:15px}
.chip.ok{color:var(--accent-text)}
.hero-num{display:flex;align-items:baseline;gap:8px;margin:14px 0 2px}
.big{font-size:52px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.unit{color:var(--muted);font-weight:600}
.bar{height:10px;background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.bar b{display:block;height:100%;background:var(--c,var(--accent));border-radius:999px;transition:width .4s}
.hero-sub{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:14px}
.stats>div{background:var(--card);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:center}
.stats .i{color:var(--c);grid-row:span 2}
.stats b{font-variant-numeric:tabular-nums;font-size:15px;line-height:1.2}
.stats span{font-size:12px;color:var(--muted);line-height:1.2}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;margin-bottom:12px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 25%,transparent)}
.banner>.i{color:var(--amber);margin-top:1px}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.banner.info>.i{color:var(--accent-text)}
.banner .grow{font-size:14px;font-weight:600}
.banner .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.banner .acts button{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;cursor:pointer}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:0 0 12px}
.card h2 .i{color:var(--accent-text);width:18px;height:18px}
.rows>.row+.row{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:6px 0}
.row.tap{cursor:pointer}
.lbl{flex:1;min-width:0}
.link{display:block;border:0;background:none;padding:4px 0 0;color:var(--accent-text);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field);display:grid;place-items:center;cursor:pointer;padding:0}
.stepper output{min-width:36px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.switch{position:relative;width:52px;height:32px;flex:none;display:inline-block}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch i{position:absolute;inset:0;background:var(--off);border-radius:999px;transition:.2s;pointer-events:none}
.switch i:before{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i:before{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2.5px solid var(--accent);outline-offset:2px}

.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--muted);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;padding:6px;line-height:1.15;text-align:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button.on .i{color:var(--accent-text)}
.seg.stack button{flex-direction:column;gap:4px;font-size:12.5px;min-height:58px}
.seg.cats button[data-v=pub].on .i{color:var(--slate)}
.seg.cats button[data-v=aux].on .i{color:var(--amber)}
.seg.cats button[data-v=reg].on .i{color:var(--accent-text)}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;min-width:0;width:100%}
textarea{resize:vertical;min-height:72px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.grid3{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}
.hm{display:flex;align-items:center;gap:6px}
.hm input{width:66px;text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:0;border-radius:14px;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:var(--accent-soft);color:var(--accent-text)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid currentColor}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 140px}
.btn:active,.icon-btn:active,.stepper button:active,.chips button:active,.pri:active{transform:scale(.97)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.chips button{min-height:44px;padding:0 4px;white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}

.day+.day{margin-top:14px}
.dayh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding-bottom:4px}
.item{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.dayh+.item{border-top:0}
.list>.item:first-child{border-top:0}
.item.off{opacity:.55}
.kic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-text)}
.kic.credit{background:var(--amber-soft);color:var(--amber)}
.kic.rv{background:var(--slate-soft);color:var(--slate)}
.grow{flex:1;min-width:0}
.ttl{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:18px 8px 8px}
.empty .i{opacity:.5}
.empty p{margin:8px 0 0;font-size:14px}

.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock{display:flex;align-items:center;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.on .clock{color:var(--accent-text)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--danger);margin-right:10px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.tbtns{display:flex;gap:8px}

.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.note .i{margin-top:1px}
.note.warn{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.note.warn .i{color:var(--amber)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.r{text-align:right}
tbody tr[data-act]{cursor:pointer}
tr.cur td{background:var(--accent-soft)}
tr.cur td:first-child{border-radius:8px 0 0 8px} tr.cur td:last-child{border-radius:0 8px 8px 0}
.mini{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mini em{display:block;height:6px;border-radius:3px;background:var(--accent);min-width:3px}
.cdot{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--cs);color:var(--c)}
.cdot .i{width:15px;height:15px}
.okc{color:var(--accent-text);display:inline-flex}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.legend .chip{background:var(--cs)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px}
.pri{flex:1;min-width:0;height:54px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;cursor:pointer;padding:0 6px}
.pri.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sep{width:1px;height:34px;background:var(--line);margin:0 2px;flex:none}
.sec{width:54px;min-height:54px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;padding:0}
.sec .pill{display:grid;place-items:center;width:46px;height:28px;border-radius:999px;transition:background .2s}
.sec.on{color:var(--accent-text)}
.sec.on .pill{background:var(--accent-soft)}
@media (max-width:400px){.pri{flex-direction:column;gap:2px;font-size:13px}.pri .i{width:19px;height:19px}}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,10px);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;min-height:48px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:10;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:800;text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:0 10px;cursor:pointer}
.credits{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 0}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- cálculos ---------- */
function calcAll(){
  const set=new Set([CUR,view]);
  S.entries.forEach(e=>set.add(e.date.slice(0,7)));Object.keys(S.months).forEach(m=>set.add(m));
  const sorted=[...set].sort();const first=sorted[0],last=sorted[sorted.length-1];
  const res={};let carry=0;const limit=Math.max(0,+S.settings.creditLimit||0)*60;
  for(let m=first;m<=last;m=addM(m,1)){
    const es=S.entries.filter(e=>e.date.startsWith(m));
    const mode=modeOf(m);
    const field=mode==='total'?(mget(m).totField||0):es.filter(e=>e.kind!=='credit').reduce((a,e)=>a+e.min,0);
    const credit=mode==='total'?(mget(m).totCredit||0):es.filter(e=>e.kind==='credit').reduce((a,e)=>a+e.min,0);
    const cat=catOf(m),isPio=cat!=='pub';
    const creditUsed=Math.min(credit,limit);
    const carryIn=isPio&&S.settings.carry?carry:0;
    const total=field+carryIn+creditUsed;
    const reported=isPio?Math.floor(total/60):0;
    const carryOut=isPio&&S.settings.carry?total%60:0;
    carry=carryOut;
    const studies=mget(m).studies??0;
    const p=mget(m).participated;
    const participated=p===undefined?(field+credit>0||studies>0):p;
    res[m]={field,credit,creditUsed,carryIn,total,reported,carryOut,isPio,cat,studies,participated,entries:es,mode,sent:!!mget(m).sent};
  }
  return res;
}

function reportText(m,c){
  const L=[t('rTitle'),''];
  if(S.settings.name)L.push(`${t('rName')}: ${S.settings.name}`);
  L.push(`${t('rMonth')}: ${monthName(m)}`);
  L.push(`${t('rPart')}: ${c.participated?t('yes'):t('no')}`);
  L.push(`${t('rStudies')}: ${c.studies}`);
  if(c.isPio){const cr=Math.floor(c.creditUsed/60);
    L.push(`${t(c.cat)} — ${t('rHours')}: ${c.reported}${cr?` (${t('rCredit',{n:cr})})`:''}`);}
  const n=mget(m).notes;if(n)L.push(`${t('rNotes')}: ${n}`);
  return L.join('\n');
}

function remPlan(){
  const s=S.settings,N=Math.min(28,Math.max(1,+s.remEnd||5)),D=Math.min(28,Math.max(1,+s.remSendDay||1));
  const [hh,mm]=(s.remTime||'09:00').split(':').map(Number);
  const now=new Date();
  // primeira ocorrência do aviso de fim de mês
  let m=CUR;let endDay=daysIn(m)+1-N;
  let endStart=new Date(+m.slice(0,4),+m.slice(5)-1,endDay,hh,mm);
  if(endStart<now){m=addM(m,1);endDay=daysIn(m)+1-N;endStart=new Date(+m.slice(0,4),+m.slice(5)-1,endDay,hh,mm)}
  // primeira ocorrência do lembrete de envio
  let sm=CUR;let sendStart=new Date(+sm.slice(0,4),+sm.slice(5)-1,D,hh,mm);
  if(sendStart<now){sm=addM(sm,1);sendStart=new Date(+sm.slice(0,4),+sm.slice(5)-1,D,hh,mm)}
  const days=s.remDaily?Array.from({length:N},(_,i)=>-(N-i)).join(','):String(-N);
  return{endStart,sendStart,endRule:`FREQ=MONTHLY;BYMONTHDAY=${days}`,sendRule:`FREQ=MONTHLY;BYMONTHDAY=${D}`};
}
// dobra linhas longas em 75 bytes (RFC 5545)
function fold(line){const enc=new TextEncoder();if(enc.encode(line).length<=75)return line;
  const out=[];let cur='',n=0,lim=75;for(const ch of line){const b=enc.encode(ch).length;if(n+b>lim){out.push(cur);cur=' ';n=1;lim=75}cur+=ch;n+=b}out.push(cur);return out.join('\r\n')}

function icsEvent(uidv,start,rule,title,desc){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  return ['BEGIN:VEVENT',`UID:${uidv}@relatorio-campo`,`DTSTAMP:${stamp}`,`DTSTART:${icsDate(start)}`,'DURATION:PT15M',
    `RRULE:${rule}`,`SUMMARY:${icsEsc(title)}`,`DESCRIPTION:${icsEsc(desc)}`,'TRANSP:TRANSPARENT',
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(title)}`,'TRIGGER:PT0M','END:VALARM','END:VEVENT'];
}
function buildICS(){
  const p=remPlan();
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Relatorio de Campo//PT-ES//','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    ...icsEvent('fim-do-mes',p.endStart,p.endRule,t('evEndT'),t('evEndD')),
    ...icsEvent('enviar-relatorio',p.sendStart,p.sendRule,t('evSendT'),t('evSendD')),
    'END:VCALENDAR'].map(fold).join('\r\n')+'\r\n';
}
function gcalUrl(which){
  const p=remPlan();const st=which==='end'?p.endStart:p.sendStart;const en=new Date(st.getTime()+15*60000);
  const q=new URLSearchParams({action:'TEMPLATE',text:t(which==='end'?'evEndT':'evSendT'),details:t(which==='end'?'evEndD':'evSendD'),
    dates:`${icsDate(st)}/${icsDate(en)}`,recur:`RRULE:${which==='end'?p.endRule:p.sendRule}`});
  try{q.set('ctz',Intl.DateTimeFormat().resolvedOptions().timeZone)}catch(e){}
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}

/* ---------- avisos no app ---------- */
function banners(all){
  let h='';const today=new Date();const d=today.getDate();const N=Math.max(1,+S.settings.remEnd||5);
  const left=daysIn(CUR)-d;
  if(view===CUR&&left<N){
    h+=`<div class="banner">${ic('hourglass')}<div class="grow">${left===0?t('bLast',{m:monthOnly(CUR)}):t('bEnd',{n:left+1,m:monthOnly(CUR)})}</div></div>`;
  }
  const prev=addM(CUR,-1),pc=all[prev];
  if(d<=10&&pc&&!pc.sent&&(pc.participated||pc.field+pc.credit>0||pc.studies>0)){
    h+=`<div class="banner">${ic('bell')}<div class="grow">${t('bSend',{m:monthOnly(prev)})}<div class="acts">
      ${view!==prev?`<button data-act="goto" data-v="${prev}">${t('openM',{m:monthOnly(prev)})}</button>`:''}<button data-act="markSent" data-v="${prev}">${ic('check','xs')} ${t('markSent')}</button></div></div></div>`;
  }
  if(IOS&&!STANDALONE){
    const shareIc=`<svg class="i xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>`;
    h+=`<div class="banner info">${ic('download')}<div class="grow">${t('installT')}<div class="small" style="font-weight:500;margin-top:4px">${t('installD',{share:shareIc})}</div></div></div>`;
  }
  const hasData=S.entries.length>0||Object.keys(S.months).length>0;
  if(hasData&&daysSince(S.settings.firstUse)>=7&&daysSince(S.settings.lastBackup)>30&&daysSince(S.settings.backupSnooze)>7){
    h+=`<div class="banner">${ic('archive')}<div class="grow">${t('backupNeeded')}<div class="acts">
      <button data-act="exportAll">${ic('download','xs')} ${t('backupNow')}</button><button data-act="snoozeBackup">${t('later')}</button></div></div></div>`;
  }

function vYear(c,all){
  const sy=syOf(view),ms=syMonths(sy);
  const monthlyGoal=Math.round((+S.settings.annualGoal||0)/12)||1;
  const maxH=Math.max(monthlyGoal,...ms.map(m=>all[m]&&catOf(m)!=='pub'?all[m].reported:0));
  let tot=0;
  const rows=ms.map(m=>{const x=all[m];const cat=catOf(m);const rep=x?x.reported:0;const future=m>CUR;if(cat!=='pub'&&!future)tot+=rep;
    return `<tr class="${m===view?'cur':''}" data-act="goto" data-v="${m}"><td>${monthName(m,{month:'short'}).replace('.','')}</td>
     <td><span class="cdot cat-${cat}" title="${t(cat)}">${ic(CAT[cat])}</span></td>
     <td>${future||!x?'':x.participated?`<span class="okc" aria-label="${t('yes')}">${ic('check','xs')}</span>`:'<span class="muted">—</span>'}</td>
     <td class="r num">${x&&!future?x.studies:''}</td>
     <td class="r">${cat!=='pub'&&x&&!future?`<div class="mini"><em style="width:${Math.round(rep/maxH*44)}px"></em><span class="num">${rep}</span></div>`:''}</td></tr>`}).join('');
  let h=`<section class="card"><h2>${ic('chart')}${t('sy',{a:sy,b:sy+1})}</h2><table><thead><tr><th>${t('month')}</th><th>${t('cat')}</th><th>${t('part')}</th><th class="r">${t('st')}</th><th class="r">${t('hrs')}</th></tr></thead>
   <tbody>${rows}<tr><td colspan="4"><strong>${t('total')}</strong></td><td class="r num">${tot}</td></tr></tbody></table>
   <div class="legend">${['pub','aux','reg'].map(k=>`<span class="chip cat-${k}">${ic(CAT[k])}${t(k)}</span>`).join('')}</div></section>`;
  const regMonths=ms.filter(m=>catOf(m)==='reg');
  if(regMonths.length){
    const ann=+S.settings.annualGoal||0;
    const regHours=regMonths.reduce((a,m)=>a+(all[m]&&m<=CUR?all[m].reported:0),0);
    let start=`${sy}-09`;const sm=S.settings.startMonth;if(sm&&sm>start&&sm<=`${sy+1}-08`)start=sm;
    const goal=Math.round(ann*ms.filter(m=>m>=start).length/12);
    const expected=Math.round(ann/12*regMonths.filter(m=>m<=CUR&&m>=start).length);
    const diff=regHours-expected;const pct=goal?Math.min(100,regHours/goal*100):0;
    h+=`<section class="card cat-reg"><h2>${ic('target')}${t('goalYear')} · ${t('reg')}</h2>
     <div class="hero-num" style="margin:0"><span class="big" style="font-size:40px">${regHours}</span><span class="unit">/ ${goal} h</span></div>
     <div class="bar"><b style="width:${pct}%"></b></div>
     <div class="rows"><div class="row"><span class="lbl">${t('pace')}</span><span class="num">${expected} h</span></div></div>
     <div class="note ${diff<0?'warn':''}">${ic(diff<0?'alert':'trend','xs')}<span>${diff===0?t('onPace'):diff>0?t('ahead',{n:diff}):t('behind',{n:-diff})}</span></div></section>`;
  }else h+=`<div class="note">${ic('info','xs')}<span>${t('notReg')}</span></div>`;
  return h;
}

   <label class="f"><span>${t('startMonth')}</span><input type="month" data-chg="set" data-v="startMonth" value="${esc(s.startMonth)}"></label>
   <div class="rows"><label class="row tap"><span class="lbl">${t('carry')}</span>${sw('carry',s.carry)}</label></div>
   <div class="note">${ic('info','xs')}<span>${t('verify')}</span></div></section>
  <section class="card"><h2>${ic('contrast')}${t('theme')}</h2>${seg('theme',s.theme,[['auto',t('auto'),'contrast'],['light',t('light'),'sun'],['dark',t('dark'),'moon']])}</section>
  <section class="card"><h2>${ic('archive')}${t('backup')}</h2><div class="btns">
   <button class="btn ghost" data-act="exportAll">${ic('download')}${t('exportAll')}</button><button class="btn ghost" data-act="importAll">${ic('upload')}${t('importAll')}</button></div>
   <button class="btn danger block" style="margin-top:8px" data-act="clear">${ic('trash')}${t('clear')}</button>
   <div class="note">${ic('archive','xs')}<span>${t('lastBackup',{d:s.lastBackup?new Intl.DateTimeFormat(locale(),{dateStyle:'medium'}).format(new Date(s.lastBackup+'T12:00')):t('never')})}</span></div>
   ${IOS?`<div class="note">${ic('info','xs')}<span>${t('iosBackup')}</span></div>`:''}
   <div class="note">${ic('lock','xs')}<span>${t('privacy')}</span></div></section>
  <p class="credits">Ícones: Lucide (ISC) · Feather (MIT)</p>`;
}

/* ---------- cronômetro ---------- */
let tInt=null;
function tickTimer(){
  clearInterval(tInt);
  const draw=()=>{const e=$('clock');if(!e)return;const s=S.timer?Math.floor((Date.now()-S.timer)/1000):0;
    e.textContent=`${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`};
  draw();if(S.timer)tInt=setInterval(draw,1000);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  const cur=()=>calcAll()[view];
  switch(a){
    case 'lang':S.settings.lang=v;save();break;
    case 'tab':tab=v;window.scrollTo&&window.scrollTo(0,0);break;
    case 'prev':view=addM(view,-1);break;
    case 'next':view=addM(view,1);break;
    case 'today':view=CUR;break;
    case 'goto':view=v;tab='month';window.scrollTo&&window.scrollTo(0,0);break;
    case 'cat':mset(view,{cat:v});break;
    case 'auxGoal':mset(view,{auxGoal:+v});break;
    case 'st':{buzz();const n=Math.max(0,(mget(view).studies??0)+ +v);mset(view,{studies:n});break}
    case 'useActive':mset(view,{studies:activeStudies()});break;
    case 'copy':copyText(reportText(view,cur()));return;
    case 'share':{const m=view;navigator.share({title:t('rTitle'),text:reportText(m,cur())}).then(()=>{mset(m,{sent:true});render()}).catch(()=>{});return}
    case 'exportMonth':download(`relatorio-${view}.json`,reportJSON(view,cur()));return;
    case 'markSent':mset(v,{sent:true});break;
    case 'mode':mset(view,{mode:v});S.settings.entryMode=v;save();break;
    case 'defmode':S.settings.entryMode=v;save();break;
    case 'defcat':S.settings.category=v;save();break;
    case 'theme':S.settings.theme=v;save();break;
    case 'ekind':entryKind=v;segSet(b);return;
    case 'ckind':contactKind=v;segSet(b);return;
    case 'tstart':S.timer=Date.now();save();break;
    case 'tdiscard':S.timer=null;save();break;
    case 'tstop':{const min=Math.floor((Date.now()-S.timer)/60000);S.timer=null;
      if(min>0){S.entries.push({id:uid(),date:todayStr(),min,kind:'field',note:t('timerNote')});view=CUR;toast(`${t('added')} · ${fmt(min)}`)}save();break}
    case 'quick':{buzz();const H=$('eH'),M=$('eM');const tot=(+H.value||0)*60+(+M.value||0)+ +v;H.value=Math.floor(tot/60)||'';M.value=tot%60||'';return}
    case 'addEntry':{const date=$('eDate').value;const min=(+$('eH').value||0)*60+(+$('eM').value||0);
      if(!date||min<=0){$('eH').focus();return}
      S.entries.push({id:uid(),date,min,kind:entryKind,note:$('eN').value.trim()});
      view=date.slice(0,7);save();toast(`${t('added')} · ${fmt(min)}`);break}
    case 'delEntry':{const i=S.entries.findIndex(x=>x.id===v);if(i<0)return;const [rem]=S.entries.splice(i,1);save();
      toast(t('removed'),()=>{S.entries.push(rem);save()});break}
    case 'addContact':{const name=$('cN').value.trim();if(!name){$('cN').focus();return}
      S.contacts.push({id:uid(),name,kind:contactKind,notes:$('cO').value.trim(),active:true});save();break}
    case 'delContact':{const i=S.contacts.findIndex(x=>x.id===v);if(i<0)return;const [rem]=S.contacts.splice(i,1);save();
      toast(t('cRemoved'),()=>{S.contacts.push(rem);save()});break}
    case 'undo':if(undoFn){undoFn();undoFn=null}$('toast').classList.remove('show');break;
    case 'ics':downloadBlob('lembretes-relatorio.ics',buildICS(),'text/calendar');toast(t('icsOk'));return;
    case 'exportAll':exportBackup();return;
    case 'snoozeBackup':S.settings.backupSnooze=todayStr();save();break;
    case 'importAll':$('importFile').click();return;
    case 'clear':if(confirm(t('confirmClear'))){const lang=S.settings.lang;S=clone(DEF);S.settings.lang=lang;save()}break;
  }
  render();
});
document.addEventListener('change',e=>{
  const el=e.target;const k=el.dataset.chg;if(!k)return;const v=el.dataset.v;
  switch(k){
    case 'part':mset(view,{participated:el.checked});break;
    case 'sent':mset(view,{sent:el.checked});break;
    case 'notes':mset(view,{notes:el.value.trim()});return;
    case 'tot':{const g=id=>Math.max(0,+$(id).value||0);
      mset(view,{mode:'total',totField:g('tfH')*60+Math.min(59,g('tfM')),totCredit:g('tcH')*60+Math.min(59,g('tcM'))});
      setTimeout(()=>{const id=document.activeElement&&document.activeElement.id;render();if(id){const n=$(id);if(n)n.focus()}},0);return}
    case 'set':S.settings[v]=el.value.trim();save();break;
    case 'setn':S.settings[v]=Math.max(0,+el.value||0);save();break;
    case 'carry':S.settings.carry=el.checked;save();break;
    case 'remDaily':S.settings.remDaily=el.checked;save();break;
    case 'cActive':{const c=S.contacts.find(x=>x.id===v);if(c)c.active=el.checked;save();break}
  }
  render();
});
$('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!Array.isArray(d.entries))throw 0;
    if(confirm(t('confirmImport'))){S=normalize(d);save();render();toast(t('importOk'))}}catch(_){toast(t('importBad'))}e.target.value=''};
  r.readAsText(f);
});
if(!S.settings.firstUse){S.settings.firstUse=todayStr();save()}
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
