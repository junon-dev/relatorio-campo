name: Gerar APK

on:
  push:
    branches: [main]
    paths-ignore: ['web/**', '.github/workflows/web.yml', 'README.md', 'CLAUDE.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes da lógica
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build.log

      - name: APK de teste (debug)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: APK otimizado (release)
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Guardar o erro no branch ci-log
        if: failure()
        run: |
          mkdir -p ci-log && cd ci-log
          grep -nE "^e: |error:|FAILED|What went wrong|> Task .* FAILED|Exception" ../build.log | head -200 > erros.txt || true
          tail -300 ../build.log > final.txt
          git init -q -b ci-log && git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Log do build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log

      - name: Renomear arquivos
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk saida/RelatorioCampo-teste.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk saida/RelatorioCampo.apk
          fi
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: saida/*.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Relatório de Campo — versão ${{ github.run_number }}
          body: |
            Baixe **RelatorioCampo.apk** no celular e toque para instalar.
            (RelatorioCampo-teste.apk é a versão de depuração, use só se a outra não aparecer.)
          files: saida/*.apk
          fail_on_unmatched_files: false

  emulador:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: saida

      - name: Habilitar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testar no emulador Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas
          path: telas/

      - name: Guardar prints no branch ci-telas
        if: always()
        run: |
          cd telas
          git init -q -b ci-telas
          git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Prints da versão ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-telas
