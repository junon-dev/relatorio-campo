name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes da lógica
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: APK de teste (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: APK otimizado (release)
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Renomear arquivos
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk saida/RelatorioCampo-teste.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk saida/RelatorioCampo.apk
          fi
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: saida/*.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Relatório de Campo — versão ${{ github.run_number }}
          body: |
            Baixe **RelatorioCampo.apk** no celular e toque para instalar.
            (RelatorioCampo-teste.apk é a versão de depuração, use só se a outra não aparecer.)
          files: saida/*.apk
          fail_on_unmatched_files: false
