name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes da lógica
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: APK de teste (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: APK otimizado (release)
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Renomear arquivos
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk saida/RelatorioCampo-teste.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk saida/RelatorioCampo.apk
          fi
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: saida/*.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Relatório de Campo — versão ${{ github.run_number }}
          body: |
            Baixe **RelatorioCampo.apk** no celular e toque para instalar.
            (RelatorioCampo-teste.apk é a versão de depuração, use só se a outra não aparecer.)
          files: saida/*.apk
          fail_on_unmatched_files: false

  emulador:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: saida

      - name: Habilitar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testar no emulador Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas
          path: telas/
